<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Tracker</title>
<meta name="description" content="A Level + IELTS chapter tracker with exam countdowns. Works offline.">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
<script>
  /* Apply the saved theme before first paint so a dark user never sees a white flash. */
  try {
    var t = JSON.parse(localStorage.getItem("study-tracker-v1") || "{}").theme;
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>Study Tracker</h1>
      <p id="todayLine">—</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="installBtn" class="ghost" hidden>Install</button>
    <button id="menuBtn" class="ghost" aria-label="Settings">⚙</button>
  </div>
</header>

<section class="countdowns" id="countdowns"></section>

<nav class="tabs" id="tabs"></nav>

<main id="view"></main>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>

    <h3>Appearance</h3>
    <div class="seg" id="themeSeg">
      <button type="button" data-theme-set="auto">Auto</button>
      <button type="button" data-theme-set="light">Light</button>
      <button type="button" data-theme-set="dark">Dark</button>
    </div>

    <h3>Exam dates</h3>
    <label>IELTS <input type="date" id="d_ielts"></label>
    <label>Mock 1 <input type="date" id="d_mock"></label>
    <label>May/June series <input type="date" id="d_final"></label>

    <h3>Your data</h3>
    <p class="hint">Progress is saved on this device only. Export a backup before clearing your browser.</p>
    <div class="row">
      <button type="button" id="exportBtn" class="ghost">Export backup</button>
      <button type="button" id="importBtn" class="ghost">Import backup</button>
    </div>
    <button type="button" id="resetBtn" class="danger">Reset all progress</button>
    <input type="file" id="importFile" accept="application/json" hidden>

    <div class="row end"><button value="close" class="primary">Done</button></div>
  </form>
</dialog>

<script src="syllabus.js"></script>
<script src="app.js"></script>
</body>
</html>
