<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>study</title>
<meta name="description" content="A Level and IELTS revision tracker with exam countdowns. Works offline.">
<meta name="theme-color" content="#1a1917">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="study">
<!-- Not black-translucent: that makes iOS draw the page under the status bar
     without adding the height back, so the layout ends up short by the top
     inset and a dead band appears under the tab bar. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>
  /* Paint in the right theme from the very first frame. Dark is the default:
     this is a terminal. */
  try {
    var t = JSON.parse(localStorage.getItem("study-tracker-v1") || "{}").theme;
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar" id="nav">
  <span class="spark">✻</span>
  <span class="path" id="navPath">~/study</span>
  <button class="esc" id="backBtn" hidden>esc <span>←</span></button>
</header>

<div class="stack" id="stack"></div>

<nav class="tabbar" id="tabbar">
  <button class="tabbtn" data-go="home">/home</button>
  <button class="tabbtn" data-go="subjects">/subjects</button>
  <button class="tabbtn" data-go="settings">/settings</button>
</nav>

<input type="file" id="importFile" accept="application/json" hidden>

<script src="syllabus.js"></script>
<script src="app.js"></script>
</body>
</html>
